services:
  postgres:
    image: postgres:16-alpine
    container_name: da-postgres
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    environment:
      POSTGRES_USER: da_user
      POSTGRES_PASSWORD: da_local_pass
      POSTGRES_DB: data_assistant
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=25
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U da_user -d data_assistant"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: da-redis
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    command:
      - redis-server
      - --maxmemory
      - 48mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Opt-in only if you ever want offline local Qdrant:
  # docker compose -f docker/docker-compose.yml --profile local-qdrant up -d
  qdrant:
    image: qdrant/qdrant:latest
    container_name: da-qdrant
    profiles: ["local-qdrant"]
    mem_limit: 256m
    cpus: 1.0
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pg_data:
  redis_data:
  qdrant_data: